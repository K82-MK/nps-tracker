name: 해외 13F 수집

on:
  schedule:
    - cron: "20 22 * * 0"      # 매주 월요일 07:20 KST (13F는 분기 말 후 45일 이내 공개)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Seoul
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 13F 수집 · 비교 · JSON
        run: python -m collector.sec13f
      - name: 변경분 커밋
        if: always()
        run: |
          git config user.name  "nps-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: 13F $(date +%F) 갱신"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
