name: 국내 연기금 수집

on:
  schedule:
    - cron: "10 9 * * 1-5"     # 평일 18:10 KST — 당일 수집
    - cron: "40 23 * * 0-4"    # 다음날 08:40 KST — 직전 영업일 확정치로 재수집
  workflow_dispatch:
    inputs:
      start_date:
        description: "시작일 (예: 2026-06-01) · 비우면 오늘 하루"
        type: string
        default: ""
      end_date:
        description: "종료일 (예: 2026-10-27) · 비우면 시작일 하루만"
        type: string
        default: ""
      recent_days:
        description: "또는 최근 N영업일 한꺼번에 (예: 120) · 입력하면 위 날짜 대신 사용"
        type: string
        default: ""
      overwrite:
        description: "이미 받은 날짜도 다시 받기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Seoul
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: SQLite 캐시 복원
        uses: actions/cache@v4
        with:
          path: db/nps.sqlite
          key: nps-db-${{ github.run_id }}
          restore-keys: nps-db-

      - name: 수집 · 저장 · JSON 내보내기
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_START: ${{ github.event.inputs.start_date }}
          IN_END: ${{ github.event.inputs.end_date }}
          IN_DAYS: ${{ github.event.inputs.recent_days }}
          IN_OVERWRITE: ${{ github.event.inputs.overwrite }}
        run: |
          ARGS=()
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "40 23 * * 0-4" ]; then ARGS=(--redo-last); fi
          else
            IN_DAYS="$(echo "$IN_DAYS" | tr -dc '0-9')"
            if [ -n "$IN_DAYS" ]; then
              ARGS=(--backfill "$IN_DAYS")
              [ -n "$IN_END" ] && ARGS+=(--date "$IN_END")
            elif [ -n "$IN_START" ]; then
              ARGS=(--start "$IN_START" --date "${IN_END:-$IN_START}")
            elif [ -n "$IN_END" ]; then
              ARGS=(--date "$IN_END")
            fi
            [ "$IN_OVERWRITE" = "true" ] && ARGS+=(--force)
          fi
          echo "실행 인자: ${ARGS[*]:-(오늘)}"
          python -m collector.run_daily "${ARGS[@]}"

      - name: 변경분 커밋
        if: always()
        run: |
          git config user.name  "nps-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: 국내 $(date +%F) 갱신"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
